
events {
    worker_connections 1024;
}

http {

    # WebSocket connection handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Forward the original protocol from Render's HTTPS proxy
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        # Render default web service port
        listen 10000;
        server_name _;

        # HTTP SECURITY HEADERS
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Allow property uploads
        # 8 photos x 5 MB plus multipart overhead
        client_max_body_size 45m;

        # Gateway health check
        location = /gateway-health {
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx-gateway"}';
        }

        # Common proxy configuration
        proxy_http_version 1.1;

        # HTTPS upstream configuration
        proxy_ssl_server_name on;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # BLOCK INTERNAL AUTH ENDPOINTS
        location ^~ /api/auth/internal/ {
            return 404;
        }

        # BLOCK INTERNAL PROPERTY ENDPOINTS
        location ^~ /api/property/internal/ {
            return 404;
        }

        # AUTH SERVICE
        location /api/auth/ {
            proxy_pass https://rentsmart-v2-auth.onrender.com;
        }

        location /auth/social/ {
            proxy_pass https://rentsmart-v2-auth.onrender.com;
        }

        # PROPERTY SERVICE
        location /api/property/ {
            proxy_pass https://rentsmart-v2-property.onrender.com;
        }

        location /api/saved/ {
            proxy_pass https://rentsmart-v2-property.onrender.com;
        }

        location /api/promote/ {
            proxy_pass https://rentsmart-v2-property.onrender.com;
        }

        location /api/actions/ {
            proxy_pass https://rentsmart-v2-property.onrender.com;
        }

        location /api/share/ {
            proxy_pass https://rentsmart-v2-property.onrender.com;
        }

        # PAYMENT SERVICE

        # Normal payment order creation
        location = /api/payment/create-order {
            proxy_pass https://rentsmart-v2-pay.onrender.com;
        }

        # Promotion order creation
        location = /api/payment/promote/order {
            proxy_pass https://rentsmart-v2-pay.onrender.com;
        }

        # Other payment endpoints
        location /api/payment/ {
            proxy_pass https://rentsmart-v2-pay.onrender.com;
        }

        # Payment history
        location /api/payments/ {
            proxy_pass https://rentsmart-v2-pay.onrender.com;
        }

        # ACTIVITY SERVICE
        location /api/activities/ {
            proxy_pass https://rentsmart-v2-activity.onrender.com;
        }

        # CHAT SERVICE - HTTP

        location = /conversations {
            proxy_pass https://rentsmart-v2-chat.onrender.com;
        }

        location /conversations/ {
            proxy_pass https://rentsmart-v2-chat.onrender.com;
        }

        location = /messages {
            proxy_pass https://rentsmart-v2-chat.onrender.com;
        }

        location /messages/ {
            proxy_pass https://rentsmart-v2-chat.onrender.com;
        }

        # CHAT SERVICE - SOCKET.IO
        location /socket.io/ {
            proxy_pass https://rentsmart-v2-chat.onrender.com;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
